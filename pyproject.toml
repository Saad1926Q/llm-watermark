[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-watermark"
version = "0.1.0"
description = "Minimal SynthID-style watermark generation, calibration, and detection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.0",
    "datasets>=3.0.0",
    "torch>=2.11.0",
    "transformers>=4.57.0",
    "tqdm>=4.67.0",
]

[project.scripts]
generate-key = "scripts.generate_key:main"
generate-data = "scripts.generate_data:main"
fit-threshold = "scripts.fit_threshold:main"
evaluate-watermark = "scripts.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"


[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
